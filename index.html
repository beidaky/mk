<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考研模考工作台</title>
<style>
:root{--bg:#e8ecef;--card:#f7f8f9;--ink:#17222d;--mute:#5d6b78;--line:#ced6dc;--acc:#2f4b7c;--on:#fff;--red:#c2402e;--ok:#3d7a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1b242c;--ink:#e6ebef;--mute:#8d9ba6;--line:#2c3844;--acc:#8fb0e8;--on:#0f1822;--red:#ef7a66;--ok:#6fbf92}}
:root[data-theme="dark"]{--bg:#12181e;--card:#1b242c;--ink:#e6ebef;--mute:#8d9ba6;--line:#2c3844;--acc:#8fb0e8;--on:#0f1822;--red:#ef7a66;--ok:#6fbf92}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 16px 48px}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font:600 20px/1.3 "Songti SC","Noto Serif SC","STSong",serif;margin:0}
.chip{border:1px solid var(--line);background:transparent;border-radius:14px;padding:3px 10px;font-size:13px;color:var(--mute)}
.chip.on{color:var(--ink);border-color:var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--line);background:transparent;border-radius:6px;font-weight:600}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card)}
.adv{margin:8px 2px 12px;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:16px;text-align:center}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.pills{display:flex;gap:6px}
.pill{border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--mute)}
.adj{display:flex;align-items:center;gap:2px;color:var(--mute)}
.adj button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 9px}
.adj b{min-width:56px;font-weight:600;color:var(--ink)}
.name{font:600 22px/1.3 "Songti SC","Noto Serif SC","STSong",serif;margin-top:10px}
.time{font-size:78px;line-height:1.1;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:6px 0 10px}
.card.warn .time{color:var(--red)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.card.warn .bar i{background:var(--red)}
.hint{margin:10px 0 0;color:var(--mute);font-size:14px;min-height:21px}
.ctl{display:flex;gap:8px;margin-top:14px}
.ctl button{flex:1;padding:13px 4px;border-radius:6px;border:1.5px solid var(--line);background:transparent;font-weight:600}
.ctl button.p{flex:1.6;background:var(--acc);border-color:var(--acc);color:var(--on)}
.ctl button:disabled{opacity:.45}
.flag{display:flex;gap:8px;margin-top:10px}
.flag input{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:transparent}
.flag button,.row button{padding:9px 14px;border:1.5px solid var(--line);background:transparent;border-radius:6px;font-weight:600}
.tot{display:flex;justify-content:space-between;margin:16px 2px 0;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:3px;height:16px;margin:8px 0 12px}
.sg{position:relative;padding:0;border:0;background:var(--line);border-radius:3px;overflow:hidden;min-width:3px}
.sg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc)}
.sg.dn i{background:var(--ok)}
.sg.ov i{background:var(--red)}
.sg.ac{outline:2px solid var(--ink);outline-offset:1px}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--mute);font-variant-numeric:tabular-nums;cursor:pointer}
li.cur{color:var(--ink);font-weight:700;border-left:4px solid var(--acc);padding-left:8px}
li.ok{color:var(--ok)}
li .ov{color:var(--red)}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1}
#review{margin-top:14px;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px}
#review h2{font:600 17px/1.3 "Songti SC","Noto Serif SC",serif;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 2px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
td:first-child,th:first-child{text-align:left}
th{color:var(--mute);font-size:13px}
.late{color:var(--red)}.early{color:var(--ok)}
.fl{margin:6px 0 0;color:var(--mute)}
@media (min-width:760px){main{max-width:1120px;padding:24px 28px 56px}h1{font-size:25px}.tabs{max-width:380px}select{max-width:560px}.adv{font-size:15px}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}.L{position:sticky;top:16px}.card{padding:26px 24px}.name{font-size:30px}.time{font-size:clamp(84px,min(11vw,22vh),150px)}.hint{font-size:16px}.ctl button{padding:16px 6px;font-size:17px}.tot{margin-top:0;font-size:15px}.seg{height:20px}li{padding:13px 6px;font-size:17px}#review{font-size:15px}}
@media (prefers-reduced-motion:no-preference){.bar i,.sg i{transition:width .25s linear}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><main>
<div class="top"><h1>考研模考工作台</h1><div><button class="chip" id="snd"></button> <button class="chip" id="aut"></button></div></div>
<div class="tabs"><button id="t-en">英语二</button><button id="t-math">数学</button></div>
<select id="pre" aria-label="方案"></select>
<p class="adv" id="adv"></p>
<div class="grid"><div class="L"><section class="card" id="card">
  <div class="meta"><div class="pills"><span class="pill" id="sc"></span><span class="pill" id="stt"></span></div>
  <div class="adj"><button id="m1" aria-label="减一分钟">−1</button><b id="pm"></b><button id="p1" aria-label="加一分钟">+1</button></div></div>
  <div class="name" id="name"></div>
  <div class="time" id="time">00:00</div>
  <div class="bar"><i id="bar"></i></div>
  <p class="hint" id="hint"></p>
  <div class="ctl"><button id="prev">上一项</button><button class="p" id="go">开始</button><button id="nx">完成 · 下一项</button></div>
  <div class="flag"><input id="note" placeholder="卡壳题号或备注（可不填）" maxlength="30"><button id="fl">标记</button></div>
</section></div>
<div class="R"><div class="tot"><span id="used"></span><span id="left"></span></div>
<div class="seg" id="seg"></div>
<ol id="list"></ol>
<div class="row"><button id="rv">用时复盘</button><button id="rs">全部重置</button></div>
<section id="review" hidden></section></div></div>
</main>
<script>
var HR=['先看题干定位原文，二选一纠结超 1 分钟就标记。','抓段首段尾和转折，不靠主观臆断。','生词跳过，看句间逻辑。','最后一篇守住节奏，别因赶时间乱选。'];
function en(rd,sm,bg,nw,tr,cl,ck,w){var a=[],i;
 for(i=0;i<4;i++)a.push(['阅读 A · 第 '+(i+1)+' 篇',rd,10,HR[i]]);
 if(w)a.push(['小作文',sm,10,'先定格式、称呼和要点，约 100 词。'],['大作文',bg,15,'图表描述、原因分析、总结，约 150 词。']);
 a.push(['新题型',nw,10,'重逻辑：看段首段尾和衔接词，别通读多遍。'],['翻译',tr,15,'整段英译汉。先抓主干再补修饰，不要留空。'],['完形填空',cl,10,'每空 0.5 分，不会就凭语感过，别死抠。']);
 if(ck)a.push(['检查 · 涂卡',ck,0,'核对答题卡，回头看标记过的题。']);return a}
var QH=['基础题，求稳，一次算对。','中档题，写清关键步骤。','第一问稳拿，第二问写出关键式也有分。','卡住先写相关定理抢步骤分。','一步一回头，防抄错。','压轴题，先拿第一问。'],QS=[10,12,12,12,12,12];
function mt(sel,fl,q,ck){var a=[];
 if(sel)a.push(['选择题 1–10',sel,50,'先易后难；单题超 4 分钟就标记跳过。']);
 if(fl)a.push(['填空题 11–16',fl,30,'算完立刻回代验算，注意符号和常数项。']);
 q.forEach(function(m,i){a.push(['解答题 第 '+(17+i)+' 题',m,QS[i],QH[i]])});
 if(ck)a.push(['检查 · 涂卡',ck,0,'先回看标记题，再核对涂卡。']);return a}
var P={
en:{train:{n:'紧迫训练 · 不含作文',a:'每项比真考少约 15%，练的是止损：到点就标记、换下一项。',s:function(){return en(17,0,0,10,17,12,0,0)}},
    trainw:{n:'紧迫训练 · 含作文',a:'含两篇作文，整体压缩约 15%，练出速度。',s:function(){return en(17,12,23,10,17,12,8,1)}},
    real:{n:'全真从容 · 180 分钟',a:'真考多出的时间留给翻译和检查。训练压得紧，考场自然从容。',s:function(){return en(20,15,25,12,20,15,13,1)}}},
math:{train:{n:'紧迫训练 · 整卷',a:'选填比真考紧约 15%，解答题每题少 2 分钟左右。',s:function(){return mt(38,18,[12,14,15,15,15,15],8)}},
    real:{n:'全真从容 · 180 分钟',a:'选填留足计算时间，大题每题 14–17 分钟，最后 15 分钟回头检查。',s:function(){return mt(45,22,[14,16,17,17,17,17],15)}},
    sel:{n:'选填专项',a:'16 道选填占 80 分，练“4 分钟止损”的条件反射。',s:function(){return mt(36,18,[],0)}},
    big:{n:'解答题专项',a:'6 道大题各限时，杜绝一道题死磕半小时。',s:function(){return mt(0,0,[12,14,15,15,15,15],0)}}}};
var $=function(i){return document.getElementById(i)};
var DB={snd:1,auto:1,subj:'en',last:{en:'train',math:'train'},runs:{}},S,running=false,t0=0,cnt=0,ac,rsT;
try{var d=JSON.parse(localStorage.getItem('kyt2'));if(d)DB=Object.assign(DB,d)}catch(e){}
function save(){try{localStorage.setItem('kyt2',JSON.stringify(DB))}catch(e){}}
function pad(n){return(n<10?'0':'')+n}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function key(){return DB.subj+':'+DB.last[DB.subj]}
function cur(){return S.st[S.a]}
function elOf(s){return s.el+(running&&s===cur()?Date.now()-t0:0)}
function commit(){if(running){var n=Date.now();cur().el+=n-t0;t0=n}}
function snap(){commit();DB.runs[key()]={m:S.st.map(function(s){return s.m}),el:S.st.map(function(s){return s.el}),dn:S.st.map(function(s){return s.dn}),a:S.a,fl:S.fl};save()}
function beep(n){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(!n||!DB.snd)return;
 for(var i=0;i<n;i++){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.25;o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)}
 if(navigator.vibrate)navigator.vibrate(n*150)}catch(e){}}
function open(){
 var p=P[DB.subj][DB.last[DB.subj]];
 S={st:p.s().map(function(x){return{n:x[0],m:x[1],sc:x[2],h:x[3],el:0,dn:0,ov:0,w:0}}),a:0,fl:[]};
 var r=DB.runs[key()];
 if(r&&r.m&&r.m.length===S.st.length){S.st.forEach(function(s,i){s.m=r.m[i];s.el=r.el[i];s.dn=r.dn[i];s.ov=s.el>s.m*6e4?1:0});S.a=r.a||0;S.fl=r.fl||[]}
 running=false;
 $('t-en').classList.toggle('on',DB.subj==='en');$('t-math').classList.toggle('on',DB.subj==='math');
 var h='',k;for(k in P[DB.subj]){var q=P[DB.subj][k],tot=q.s().reduce(function(a,x){return a+x[1]},0);h+='<option value="'+k+'">'+q.n+'（'+tot+' 分钟）</option>'}
 $('pre').innerHTML=h;$('pre').value=DB.last[DB.subj];$('adv').textContent=p.a;
 var sg='',l='';S.st.forEach(function(s,i){sg+='<button class="sg" data-i="'+i+'" aria-label="'+s.n+'"><i></i></button>';l+='<li data-i="'+i+'"><span>'+s.n+'</span><span class="u"></span></li>'});
 $('seg').innerHTML=sg;$('list').innerHTML=l;$('review').hidden=true;draw()}
function allDone(){return S.st.every(function(s){return s.dn})}
function draw(){
 var s=cur(),e=elOf(s),dur=s.m*6e4,rem=dur-e,over=rem<0,low=!over&&rem<=12e4&&s.m>=5;
 $('name').textContent=s.n;$('sc').textContent=s.sc?s.sc+' 分':'不计分';
 $('stt').textContent=s.dn?'已完成':over?'超时':running?'进行中':e>0?'已暂停':'待开始';
 $('time').textContent=(over?'+':'')+fmt(Math.abs(rem));
 $('card').classList.toggle('warn',over||low);
 $('bar').style.width=Math.min(100,e/dur*100)+'%';
 $('hint').textContent=s.h;$('pm').textContent=s.m+' 分钟';
 $('go').textContent=allDone()?'已收卷':running?'暂停':e>0?'继续':'开始';$('go').disabled=allDone();
 $('prev').disabled=S.a===0;$('fl').textContent='标记'+(S.fl.length?'（'+S.fl.length+'）':'');
 $('snd').textContent='提示音：'+(DB.snd?'开':'关');$('snd').classList.toggle('on',!!DB.snd);
 $('aut').textContent='到点自动切换：'+(DB.auto?'开':'关');$('aut').classList.toggle('on',!!DB.auto);
 var used=0,plan=0,sg=$('seg').children,li=$('list').children;
 S.st.forEach(function(x,i){var el=elOf(x);used+=el;plan+=x.m*6e4;var o=el>x.m*6e4;
  sg[i].style.flex=x.m;sg[i].className='sg'+(x.dn?' dn':'')+(i===S.a?' ac':'')+(o?' ov':'');sg[i].firstChild.style.width=Math.min(100,el/(x.m*6e4)*100)+'%';
  li[i].className=(i===S.a?'cur ':'')+(x.dn?'ok':'');var u=li[i].lastChild;u.className='u'+(o?' ov':'');u.textContent=(el>0||x.dn?fmt(el)+' / ':'')+x.m+' 分钟'});
 $('used').textContent='已用 '+fmt(used);$('left').textContent=plan>=used?'全卷剩余 '+fmt(plan-used):'超出计划 '+fmt(used-plan)}
function tick(){var s=cur();
 if(running){var rem=s.m*6e4-elOf(s);
  if(rem<=0&&!s.dn){if(DB.auto){fin();return}if(!s.ov){s.ov=1;beep(3)}}
  else if(rem>0&&rem<=12e4&&!s.w&&s.m>=5){s.w=1;beep(2)}
  if(++cnt%8===0)snap()}
 draw()}
function fin(){commit();var was=running,s=cur(),n=-1,i,j;s.dn=1;
 for(i=1;i<=S.st.length;i++){j=(S.a+i)%S.st.length;if(!S.st[j].dn){n=j;break}}
 if(n<0){running=false;beep(3);snap();draw();showRv();return}
 S.a=n;t0=Date.now();running=was;beep(DB.auto&&was?3:1);snap();draw()}
function pick(j){commit();S.a=j;S.st[j].dn=0;t0=Date.now();snap();draw()}
function showRv(){
 var tu=0,tp=0,late=0,h='<h2>用时复盘</h2><table><tr><th>模块</th><th>计划</th><th>实际</th><th>差</th></tr>';
 S.st.forEach(function(s){var el=elOf(s),df=Math.round((el-s.m*6e4)/1000);tu+=el;tp+=s.m*6e4;if(df>0)late++;
  h+='<tr><td>'+esc(s.n)+'</td><td>'+s.m+':00</td><td>'+fmt(el)+'</td><td class="'+(df>0?'late':'early')+'">'+(el>0?(df>0?'+':'−')+fmt(Math.abs(df)*1000):'—')+'</td></tr>'});
 h+='</table><p class="fl">合计 '+fmt(tu)+' / 计划 '+fmt(tp)+'，超时 '+late+' 项。</p>';
 if(S.fl.length){h+='<h2 style="margin-top:12px">卡壳标记</h2>';S.fl.forEach(function(f,i){h+='<p class="fl">'+(i+1)+'. ['+esc(f.n)+'] '+esc(f.t)+'（用时 '+f.at+'）</p>'})}
 else h+='<p class="fl">本场没有卡壳标记。</p>';
 $('review').innerHTML=h;$('review').hidden=false;$('review').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('go').onclick=function(){if(allDone())return;
 if(!running){beep(0);t0=Date.now();running=true;try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
 else{commit();running=false}snap();draw()};
$('nx').onclick=function(){if(!allDone())fin()};
$('prev').onclick=function(){if(S.a>0)pick(S.a-1)};
function adj(d){var s=cur();s.m=Math.max(1,s.m+d);var rem=s.m*6e4-elOf(s);if(rem>0)s.ov=0;if(rem>12e4)s.w=0;snap();draw()}
$('m1').onclick=function(){adj(-1)};$('p1').onclick=function(){adj(1)};
$('fl').onclick=function(){var s=cur(),t=$('note').value.trim();S.fl.push({n:s.n,at:fmt(elOf(s)),t:t||'待回看'});$('note').value='';snap();draw()};
$('note').onkeydown=function(e){if(e.key==='Enter')$('fl').onclick()};
function jump(e){var t=e.target.closest('[data-i]');if(t)pick(+t.dataset.i)}
$('seg').onclick=jump;$('list').onclick=jump;
$('rv').onclick=function(){if($('review').hidden)showRv();else $('review').hidden=true};
$('rs').onclick=function(){
 if($('rs').dataset.c){clearTimeout(rsT);delete $('rs').dataset.c;$('rs').textContent='全部重置';delete DB.runs[key()];running=false;save();open();return}
 $('rs').dataset.c=1;$('rs').textContent='再点一次确认重置';rsT=setTimeout(function(){delete $('rs').dataset.c;$('rs').textContent='全部重置'},3000)};
$('pre').onchange=function(){snap();running=false;DB.last[DB.subj]=$('pre').value;save();open()};
function tab(k){snap();running=false;DB.subj=k;save();open()}
$('t-en').onclick=function(){tab('en')};$('t-math').onclick=function(){tab('math')};
$('snd').onclick=function(){DB.snd=DB.snd?0:1;save();draw()};
$('aut').onclick=function(){DB.auto=DB.auto?0:1;save();draw()};
open();setInterval(tick,250);
</script></body></html>
